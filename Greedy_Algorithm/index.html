<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Vaktaplan Þjónustufulltrúa</title>

<style>
body {
    font-family: Arial;
    background: #f5f5f5;
    text-align: center;
    margin-top: 100px;
}

.container {
    background: white;
    padding: 40px;
    width: 400px;
    margin: auto;
    border-radius: 10px;
    box-shadow: 0 0 20px rgba(0,0,0,0.1);
}

h1 {
    margin-bottom: 20px;
}

.drop-zone {
    border: 2px dashed #999;
    padding: 30px;
    cursor: pointer;
    margin-bottom: 20px;
}

.drop-zone:hover {
    border-color: #e65c10;
}

button {
    padding: 12px 20px;
    border: none;
    background: #ff6e1b;
    color: white;
    font-size: 16px;
    cursor: pointer;
    border-radius: 5px;
    margin-top: 10px;
}

button:hover {
    background: #e65c10;
}

/* Status (mitt á milli takka) */
#status {
    margin: 25px 0;
    min-height: 28px;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 16px;
}

/* Download button */
#download {
    display: none;
}

/* Template link */
.template-link {
    display: block;
    margin-bottom: 20px;
    color: #ff6e1b;
    text-decoration: none;
    font-weight: bold;
}

.template-link:hover {
    text-decoration: underline;
}
</style>
</head>

<body>

<div class="container">
    <h1>Vaktaplan Þjónustufulltrúa</h1>

    <!-- 🔥 TEMPLATE DOWNLOAD -->
    <a href="/template" class="template-link" download>
        Sækja Excel sniðmát
    </a>

    <div class="drop-zone" id="drop">
        Dragðu Excel-skrá hingað <br>
        eða smelltu til að velja
    </div>

    <input type="file" id="fileInput" hidden>

    <!-- TAKKI 1 -->
    <button onclick="upload()">Búa til vaktaplan</button>

    <!-- STATUS -->
    <div id="status"></div>

    <!-- TAKKI 2 -->
    <a id="download" href="#" download>
        <button>Sækja vaktaplan</button>
    </a>
</div>

<script>
let selectedFile = null;

const drop = document.getElementById("drop");
const fileInput = document.getElementById("fileInput");
const status = document.getElementById("status");
const download = document.getElementById("download");

// click
drop.onclick = () => fileInput.click();

// file select
fileInput.onchange = () => {
    selectedFile = fileInput.files[0];
    drop.innerHTML = selectedFile.name;
};

// drag
drop.ondragover = (e) => {
    e.preventDefault();
    drop.style.borderColor = "#ff6e1b";
};

drop.ondragleave = () => {
    drop.style.borderColor = "#999";
};

drop.ondrop = (e) => {
    e.preventDefault();
    selectedFile = e.dataTransfer.files[0];
    drop.innerHTML = selectedFile.name;
};

// upload
async function upload() {

    if (!selectedFile) {
        alert("Select file first");
        return;
    }

    status.innerHTML = "Býr til vaktaplan...";
    download.style.display = "none";

    const formData = new FormData();
    formData.append("file", selectedFile);

    const res = await fetch("/run", {
        method: "POST",
        body: formData
    });

    const data = await res.json();

    if (data.status === "success") {
        status.innerHTML = "Vaktaplan tilbúið ✅";

        download.href = data.download_url;
        download.style.display = "block";

    } else {
        status.innerHTML = "Villa ❌";
        console.error(data);
    }
}
</script>

</body>
</html>
