<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Vaktaplan Þjónustufulltrúa</title>

<style>
body {
    font-family: Arial;
    background: #f5f5f5;
    text-align: center;
    margin-top: 100px;
}

.container {
    background: white;
    padding: 40px;
    width: 400px;
    height: 420px; /* 🔥 fast height */
    margin: auto;
    border-radius: 10px;
    box-shadow: 0 0 20px rgba(0,0,0,0.1);

    display: flex;
    flex-direction: column;
    justify-content: space-between;
}

h1 {
    margin-bottom: 20px;
}

.drop-zone {
    border: 2px dashed #999;
    height: 90px; /* 🔥 fixed size */
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    cursor: pointer;
    margin-bottom: 20px;

    overflow: hidden;
}

.drop-zone span {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.drop-zone:hover {
    border-color: #e65c10;
}

button {
    padding: 12px 20px;
    border: none;
    background: #ff6e1b;
    color: white;
    font-size: 16px;
    cursor: pointer;
    border-radius: 5px;
    margin-top: 10px;
}

button:hover {
    background: #e65c10;
}

/* Status */
#status {
    margin: 25px 0;
    min-height: 28px;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 16px;
    text-align: center;
}

/* Download */
#download {
    display: none;
}

/* Template */
.template-link {
    display: block;
    margin-bottom: 20px;
    color: #ff6e1b;
    text-decoration: none;
    font-weight: bold;
}

.template-link:hover {
    text-decoration: underline;
}
</style>
</head>

<body>

<div class="container">
    <h1>Vaktaplan Þjónustufulltrúa</h1>

    <a href="/template" class="template-link" download>
        Sækja Excel sniðmát
    </a>

    <div class="drop-zone" id="drop">
        <span>Dragðu Excel-skrá hingað <br> eða smelltu til að velja</span>
    </div>

    <input type="file" id="fileInput" hidden>

    <button onclick="validateFile()">Athuga skjal</button>
    <button onclick="upload()">Búa til vaktaplan</button>

    <div id="status"></div>

    <a id="download" href="#" download>
        <button>Sækja vaktaplan</button>
    </a>
</div>

<script>
let selectedFile = null;

const drop = document.getElementById("drop");
const fileInput = document.getElementById("fileInput");
const status = document.getElementById("status");
const download = document.getElementById("download");

// click
drop.onclick = () => fileInput.click();

// file select
fileInput.onchange = () => {
    selectedFile = fileInput.files[0];
    drop.innerHTML = "<span>" + selectedFile.name + "</span>";
};

// drag
drop.ondragover = (e) => {
    e.preventDefault();
    drop.style.borderColor = "#ff6e1b";
};

drop.ondragleave = () => {
    drop.style.borderColor = "#999";
};

drop.ondrop = (e) => {
    e.preventDefault();
    selectedFile = e.dataTransfer.files[0];
    drop.innerHTML = "<span>" + selectedFile.name + "</span>";
};

// =========================
// VALIDATE
// =========================
async function validateFile() {

    if (!selectedFile) {
        alert("Veldu skrá fyrst");
        return;
    }

    status.innerHTML = "Athuga skjal...";
    status.style.color = "black";

    const formData = new FormData();
    formData.append("file", selectedFile);

    const res = await fetch("/validate", {
        method: "POST",
        body: formData
    });

    const data = await res.json();

    if (data.status === "error") {

        status.innerHTML = "❌<br>" + data.errors.join("<br>");
        status.style.color = "red";

    } else {

        if (data.warnings && data.warnings.length > 0) {
            status.innerHTML = "⚠️<br>" + data.warnings.join("<br>");
            status.style.color = "#e65c10";
        } else {
            status.innerHTML = "✅ Engar villur fundust";
            status.style.color = "green";
        }
    }
}

// =========================
// RUN
// =========================
async function upload() {

    if (!selectedFile) {
        alert("Veldu skrá fyrst");
        return;
    }

    status.innerHTML = "Býr til vaktaplan...";
    status.style.color = "black";
    download.style.display = "none";

    const formData = new FormData();
    formData.append("file", selectedFile);

    const res = await fetch("/run", {
        method: "POST",
        body: formData
    });

    const data = await res.json();

    if (data.status === "success") {

        let message = "Vaktaplan tilbúið ✅";

        if (data.warnings && data.warnings.length > 0) {
            message += "<br><br>⚠️ Ekki tókst að manna allar vaktir:<br>";
            message += data.warnings.join("<br>");
        }

        status.innerHTML = message;
        status.style.color = "green";

        download.href = data.download_url;
        download.style.display = "block";

    } else {

        status.innerHTML = "❌<br>" + data.errors.join("<br>");
        status.style.color = "red";
    }
}
</script>

</body>
</html>
