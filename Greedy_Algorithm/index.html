<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Vaktaplan Þjónustufulltrúa</title>

<style>
body {
    font-family: Arial;
    background: #f5f5f5;
    text-align: center;
    margin-top: 100px;
}

.container {
    background: white;
    padding: 40px;
    width: 400px;
    min-height: 520px;
    margin: auto;
    border-radius: 10px;
    box-shadow: 0 0 20px rgba(0,0,0,0.1);

    display: flex;
    flex-direction: column;
    justify-content: space-between;
}

h1 {
    margin-bottom: 20px;
}

.drop-zone {
    border: 2px dashed #999;
    height: 90px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    margin-bottom: 15px;
    text-align: center;
    padding: 10px;
}

.drop-zone:hover {
    border-color: #ff6e1b;
}

button {
    padding: 12px;
    border: none;
    background: #ff6e1b;
    color: white;
    font-size: 16px;
    cursor: pointer;
    border-radius: 5px;
}

.button-row {
    display: flex;
    gap: 10px;
}

#status {
    margin: 10px 0;
    min-height: 40px;
}

#download {
    visibility: hidden;
}
</style>
</head>

<body>

<div class="container">

<h1>Vaktaplan</h1>

<!-- CURRENT FILE -->
<div class="drop-zone" id="dropCurrent">
    <span>Núverandi Excel skjal</span>
</div>
<input type="file" id="fileCurrent" hidden>

<!-- PREVIOUS FILE -->
<div class="drop-zone" id="dropPrevious">
    <span>Fyrra vaktaplan (optional)</span>
</div>
<input type="file" id="filePrevious" hidden>

<div class="button-row">
    <button onclick="upload()">Keyra</button>
</div>

<div id="status"></div>

<a id="download" href="#" download>
    <button>Sækja vaktaplan</button>
</a>

</div>

<script>
let currentFile = null;
let previousFile = null;

// elements
const dropCurrent = document.getElementById("dropCurrent");
const dropPrevious = document.getElementById("dropPrevious");

const fileCurrent = document.getElementById("fileCurrent");
const filePrevious = document.getElementById("filePrevious");

const status = document.getElementById("status");
const download = document.getElementById("download");

// =====================
// CURRENT FILE
// =====================
dropCurrent.onclick = () => fileCurrent.click();

fileCurrent.onchange = () => {
    currentFile = fileCurrent.files[0];
    dropCurrent.innerHTML = "<span>" + currentFile.name + "</span>";
};

// =====================
// PREVIOUS FILE
// =====================
dropPrevious.onclick = () => filePrevious.click();

filePrevious.onchange = () => {
    previousFile = filePrevious.files[0];
    dropPrevious.innerHTML = "<span>" + previousFile.name + "</span>";
};

// =====================
// UPLOAD
// =====================
async function upload() {

    if (!currentFile) {
        alert("Veldu núverandi skrá");
        return;
    }

    status.innerHTML = "Keyri...";
    status.style.color = "black";
    download.style.visibility = "hidden";

    const formData = new FormData();
    formData.append("current_file", currentFile);

    if (previousFile) {
        formData.append("previous_file", previousFile);
    }

    const res = await fetch("/run", {
        method: "POST",
        body: formData
    });

    const data = await res.json();

    if (data.status === "success") {

        status.innerHTML = "Vaktaplan tilbúið ✅";
        status.style.color = "green";

        download.href = data.download_url;
        download.style.visibility = "visible";

    } else {

        status.innerHTML = "Villa ❌";
        status.style.color = "red";
    }
}
</script>

</body>
</html>
